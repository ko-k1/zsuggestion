[package]
name = "zsuggestion"
version = "0.3.0"
edition = "2024"
# 1.89 stabilized std::fs::File::{try_lock, unlock}.
rust-version = "1.89"
description = "Nvim-style shell suggestion popup for Zsh"
repository = "https://github.com/ko-k1/zsuggestion"
license = "MIT"
readme = "README.md"
keywords = ["shell", "completion", "zsh", "suggestions", "popup"]
categories = ["command-line-utilities"]
include = ["/src", "/test", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.177"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.23.0"

[[test]]
name = "zle_integration"
path = "test/zle_integration.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
